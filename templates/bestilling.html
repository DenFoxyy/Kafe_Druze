<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/calendar_script.js') }}" defer></script>
</head>
<body>
    <main class="page">
    <a class="book-button cancel-button" href="{{ url_for('index') }}" tabindex="0">cancell reservation</a>
    <section class="top">
        <p class="small-text">Book a table</p>
        <h1>Make your reservation</h1>
        <p class="info">Choose a date that suits you and submit your booking within seconds.</p>
        {% if validation_error %}
            <p class="validation-error" role="alert">{{ validation_error }}</p>
        {% endif %}
    </section>
<div class="calendar_body">
        <div class="guest-picker">
            <label for="guest-count">Guests</label>
            <div class="guest-select-control">
                <svg class="guest-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="10" cy="7" r="4"></circle>
                    <path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <select id="guest-count" name="guest_count">
                    <option value="1">1 guest</option>
                    <option value="2">2 guests</option>
                    <option value="3">3 guests</option>
                    <option value="4">4 guests</option>
                    <option value="5">5 guests</option>
                    <option value="6">6 guests</option>
                    <option value="7">7 guests</option>
                    <option value="8">8 guests</option>
                    <option value="9">9 guests</option>
                    <option value="10">10 guests</option>
                </select>
            </div>
        </div>
        <div class="calendar">
            <div class="calendar_inner">
                <div class="calendar_controls">
                    <img
                        class="calendar-logo"
                        src="{{ url_for('static', filename='images/KAFE’ DRUZE logo.png') }}"
                        alt="Kafe' Druze Logo"
                    >
                    <div class="calendar_headings">
                        <button class="calendar-arrow" type="button" id="prev" aria-label="Previous month">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="m15 18-6-6 6-6"></path>
                            </svg>
                        </button>
                        <h2 class="month_year"></h2>
                        <button class="calendar-arrow" type="button" id="next" aria-label="Next month">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="m9 18 6-6-6-6"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="current_datetime">
                        <p class="daytxt">Today</p>
                        <p class="datetxt"></p>
                    </div>
                    <div class="days_date">
                        <ul class="days">
                            <li>Mon</li>
                            <li>Tue</li>
                            <li>Wed</li>
                            <li>Thu</li>
                            <li>Fri</li>
                            <li>Sat</li>
                            <li>Sun</li>
                        </ul>
                        <ul class="dates">
                        </ul>
                    </div>
                </div>
            </div>
            <div class="time-picker guest-picker" id="time-picker" hidden>
                <label for="reservation-time">Available times</label>
                <div class="guest-select-control">
                    <svg class="guest-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M12 7v5l3 2"></path>
                    </svg>
                    <select id="reservation-time" name="reservation_time" required>
                        <option value="" selected disabled>Select a time</option>
                    </select>
                </div>
                <button class="book-button" id="book-button" type="button" hidden>Book</button>
            </div>
            <form class="reservation-form guest-picker" id="reservation-form" action="{{ url_for('bestilling') }}" method="post" hidden>
                <div class="booking-summary" aria-label="Reservation summary">
                    <p><span id="summary-guests"></span> guests</p>
                    <p><span id="summary-date"></span></p>
                    <p><span id="summary-time"></span></p>
                    <p><a href="tel:+4723465700">+47 234 65 700</a></p>
                </div>
                <input id="booking-guests" name="guests" type="hidden">
                <input id="booking-date" name="date" type="hidden">
                <input id="booking-time" name="time" type="hidden">

                <div class="reservation-fields">
                    <div class="input-group">
                        <label for="first-name">First name</label>
                        <input id="first-name" name="first_name" type="text" placeholder="e.g. John" autocomplete="given-name" required>
                    </div>
                    <div class="input-group">
                        <label for="last-name">Last name</label>
                        <input id="last-name" name="last_name" type="text" placeholder="e.g. Doe" autocomplete="family-name" required>
                    </div>
                    <div class="input-group">
                        <label for="phone">Phone number</label>
                        <input id="phone" name="phone" type="tel" placeholder="+47" autocomplete="tel" inputmode="tel" pattern="[0-9+() .-]*[0-9][0-9+() .-]*" title="Enter a phone number containing digits only, with an optional country code." required>
                    </div>
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input id="email" name="email" type="email" placeholder="e.g. johndoe@email.com" autocomplete="email" pattern="[^@\s]+@[^@\s]+\.[^@\s]+" title="Enter an email address containing @ and a domain." required>
                    </div>
                    <div class="input-group">
                        <label for="comment">Comment <span class="optional-label">optional</span></label>
                        <textarea id="comment" name="comment" placeholder="Enter comment to the restaurant"></textarea>
                    </div>
                </div>
                <button class="book-button" type="submit">Confirm booking</button>
            </form>
            </div>
        </div>
    </main>
</body>
</html>
